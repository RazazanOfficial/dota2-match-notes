name: Create v1.0.0 tag

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated release tag
        env:
          TARGET_SHA: 139bae7fd6584d257b637795da3f6fee483e0fcb
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a v1.0.0 "$TARGET_SHA" -m "Dota 2 Match Notes v1.0.0"
          git push origin refs/tags/v1.0.0
