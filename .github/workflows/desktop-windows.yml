name: Windows desktop test installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:companion
      - run: node apps/desktop/scripts/prepare-native.mjs
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: dota-notes-windows-test-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
