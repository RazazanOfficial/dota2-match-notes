<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="دفتر فارسی ثبت و مرور مچ‌های دوتا ۲" />
    <title>دفتر مچ‌های دوتا ۲</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="loading-screen" id="loadingScreen">
      <span class="loading-mark" aria-hidden="true">D2</span>
      <span class="loading-line"></span>
    </section>

    <section class="access-screen" id="accessScreen" hidden>
      <header class="access-brand">
        <span class="brand-mark" aria-hidden="true">D2</span>
        <div>
          <p class="eyebrow">MATCH JOURNAL</p>
          <h1>دفتر مچ‌های دوتا ۲</h1>
        </div>
      </header>

      <main class="access-panel">
        <div class="access-heading">
          <p class="week-kicker" id="accessKicker">دسترسی</p>
          <h2 id="accessTitle">نوع ورود را انتخاب کنید</h2>
        </div>

        <div class="role-grid" id="roleChooser">
          <button class="role-card role-player" type="button" data-role="player">
            <span class="role-icon" aria-hidden="true">✦</span>
            <span class="role-name">بازیکن</span>
            <span class="role-description">ثبت و مدیریت بازی‌ها</span>
          </button>
          <button class="role-card role-coach" type="button" data-role="coach">
            <span class="role-icon" aria-hidden="true">◎</span>
            <span class="role-name">مربی</span>
            <span class="role-description">مشاهده گزارش بازیکن</span>
          </button>
        </div>

        <form class="access-form" id="playerAccessForm" hidden>
          <label class="field">
            <span>آیدی استیم</span>
            <input
              id="playerSteamId"
              name="steamId"
              type="text"
              inputmode="numeric"
              autocomplete="username"
              placeholder="آیدی استیم را وارد کنید"
              maxlength="17"
              required
            />
          </label>
          <label class="field">
            <span>رمز</span>
            <input
              id="playerPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="4"
              required
            />
          </label>
          <p class="form-error" id="playerAccessError" role="alert"></p>
          <div class="access-actions">
            <button class="secondary-button access-back-button" type="button">بازگشت</button>
            <button class="primary-button access-submit-button" type="submit">
              ورود / ساخت حساب
            </button>
          </div>
        </form>

        <form class="access-form" id="coachAccessForm" hidden>
          <label class="field">
            <span>آیدی استیم بازیکن</span>
            <input
              id="coachSteamId"
              name="steamId"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="آیدی استیم را وارد کنید"
              maxlength="17"
              required
            />
          </label>
          <p class="form-error" id="coachAccessError" role="alert"></p>
          <div class="access-actions">
            <button class="secondary-button access-back-button" type="button">بازگشت</button>
            <button class="primary-button access-submit-button" type="submit">مشاهده</button>
          </div>
        </form>

        <div class="setup-state" id="setupState" hidden>
          <span class="setup-state-icon" aria-hidden="true">⚙</span>
          <strong>راه‌اندازی در حال تکمیل است</strong>
        </div>
      </main>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">D2</span>
          <div>
            <p class="eyebrow">MATCH JOURNAL</p>
            <h1>دفتر مچ‌های دوتا ۲</h1>
          </div>
        </div>

        <div class="account-summary">
          <div class="account-copy">
            <span class="mode-badge" id="modeBadge">بازیکن</span>
            <strong id="activeSteamId"></strong>
          </div>
          <span class="sync-status" id="syncStatus">
            <span class="status-dot"></span>
            همگام
          </span>
          <button class="secondary-button account-exit-button" id="leaveButton" type="button">
            خروج
          </button>
        </div>
      </header>

      <main>
        <section class="week-overview" aria-labelledby="weekTitle">
          <div class="week-heading">
            <div>
              <p class="week-kicker" id="weekLabel">هفته اول</p>
              <h2 id="weekTitle">۳ تا ۹ مرداد ۱۴۰۵</h2>
            </div>

            <div class="week-navigation" aria-label="پیمایش هفته‌ها">
              <button class="nav-button" id="previousWeekButton" type="button">
                <span aria-hidden="true">→</span>
                هفته قبل
              </button>
              <button class="today-button" id="currentWeekButton" type="button">هفته جاری</button>
              <button class="nav-button" id="nextWeekButton" type="button">
                هفته بعد
                <span aria-hidden="true">←</span>
              </button>
            </div>
          </div>

          <div class="week-stats" aria-label="آمار هفته">
            <article class="stat-card">
              <span>کل بازی‌ها</span>
              <strong id="weekGames">۰</strong>
            </article>
            <article class="stat-card stat-win">
              <span>برد</span>
              <strong id="weekWins">۰</strong>
            </article>
            <article class="stat-card stat-loss">
              <span>باخت</span>
              <strong id="weekLosses">۰</strong>
            </article>
            <article class="stat-card">
              <span>نرخ برد</span>
              <strong id="weekWinRate">۰٪</strong>
            </article>
            <button class="report-button" id="weekReportButton" type="button">
              گزارش هفته
            </button>
          </div>
        </section>

        <section class="calendar" id="calendar" aria-label="تقویم هفتگی"></section>
      </main>
    </div>

    <dialog class="modal match-modal" id="matchDialog">
      <form method="dialog" id="matchForm">
        <div class="modal-header">
          <div>
            <p class="modal-kicker" id="matchDialogDate"></p>
            <h2 id="matchDialogTitle">ثبت بازی</h2>
          </div>
          <button class="close-button" type="button" data-close-dialog="matchDialog" aria-label="بستن">
            ×
          </button>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>شماره بازی</span>
            <input id="matchNumber" name="matchNumber" type="number" min="1" required />
          </label>

          <label class="field">
            <span>هیرو</span>
            <input id="hero" name="hero" type="text" maxlength="100" autocomplete="off" required />
          </label>

          <label class="field field-full">
            <span>بن‌ها</span>
            <input id="bans" name="bans" type="text" maxlength="500" autocomplete="off" />
          </label>

          <label class="field field-full">
            <span>یادداشت بازی</span>
            <textarea id="notes" name="notes" maxlength="5000" rows="5"></textarea>
          </label>

          <fieldset class="result-field field-full">
            <legend>نتیجه</legend>
            <div class="result-options">
              <label class="result-option result-option-win">
                <input type="radio" name="result" value="win" required />
                <span>برد</span>
              </label>
              <label class="result-option result-option-loss">
                <input type="radio" name="result" value="loss" required />
                <span>باخت</span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="modal-actions">
          <button class="secondary-button danger-button" id="deleteMatchButton" type="button" hidden>
            حذف بازی
          </button>
          <span class="action-spacer"></span>
          <button class="secondary-button" type="button" data-close-dialog="matchDialog">انصراف</button>
          <button class="primary-button" type="submit">ثبت بازی</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal report-modal" id="reportDialog">
      <div class="modal-header">
        <div>
          <p class="modal-kicker" id="reportWeekLabel">هفته اول</p>
          <h2>گزارش هفتگی</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog="reportDialog" aria-label="بستن">
          ×
        </button>
      </div>

      <textarea class="report-output" id="reportOutput" readonly></textarea>

      <div class="modal-actions">
        <button class="secondary-button" id="downloadReportButton" type="button">دریافت گزارش</button>
        <span class="action-spacer"></span>
        <button class="primary-button" id="copyReportButton" type="button">کپی گزارش</button>
      </div>
    </dialog>

    <dialog class="modal confirm-modal" id="confirmDialog">
      <div class="modal-header">
        <h2 id="confirmTitle">تأیید</h2>
        <button class="close-button" type="button" data-close-dialog="confirmDialog" aria-label="بستن">
          ×
        </button>
      </div>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <span class="action-spacer"></span>
        <button class="secondary-button" id="confirmCancelButton" type="button">انصراف</button>
        <button class="primary-button danger-solid-button" id="confirmAcceptButton" type="button">تأیید</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./core.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
