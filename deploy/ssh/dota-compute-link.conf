# Append once at the END of Iran sshd_config, after a backup.
# Do not put this Match block in an early Include directory: subsequent global
# directives in the main config would be interpreted inside the Match block.
Match User dota-link
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding yes
    PermitOpen 127.0.0.1:5432
    PermitListen 127.0.0.1:14100
    GatewayPorts no
    ClientAliveInterval 15
    ClientAliveCountMax 3
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 0
