# Only install on the 4-vCPU / 8-GiB Germany host, after the final data cutover.
# Keep the original unit unchanged for the Iran host.
[Service]
Environment=LOCAL_REPLAY_DOWNLOAD_MODE=direct
Environment=LOCAL_REPLAY_PREPARE_CONCURRENCY=2
Environment=LOCAL_REPLAY_PARSE_CONCURRENCY=2
Environment=LOCAL_REPLAY_ARCHIVE_CONCURRENCY=1
CPUQuota=250%
MemoryHigh=3G
MemoryMax=4G
