# Dedicated API virtual host. Keep the intro/legacy frontend configuration separate.
# During installation add the TLS certificate using the server's certificate tooling.
# Until HTTPS is enabled, production clients must not connect to this HTTP listener.
server {
    listen 80;
    listen [::]:80;
    server_name api.dota2notes.ir;
    client_max_body_size 1m;

    location ~* ^/api/(v1/)?internal(/|$) { return 404; }
    # Readiness is for local operations; do not expose database status publicly.
    location = /health/ready { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;
    }
}
