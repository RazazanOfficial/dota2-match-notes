[package]
name = "dota-notes-companion"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
keyring = { version = "=3.6.3", features = ["windows-native"] }
[profile.release]
strip = true
lto = true
