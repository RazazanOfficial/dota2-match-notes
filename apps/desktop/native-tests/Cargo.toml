[package]
name = "dota-replay-native-tests"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
bzip2 = "=0.5.2"
zstd = { version = "=0.13.3", default-features = false }
tempfile = "=3.27.0"
[profile.dev]
debug = 0
